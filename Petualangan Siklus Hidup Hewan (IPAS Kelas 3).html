<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Siklus Hidup Hewan</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2a33;--mute:#6b6878;--pri:#2e9e5b;--acc:#ff8a3d;--line:#f0dfb8;--ok:#2e9e5b;--bad:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b22;--card:#2a2933;--ink:#f4f1ea;--mute:#b3afc2;--pri:#5fd391;--acc:#ffa664;--line:#3d3b4a}}
:root[data-theme="dark"]{--bg:#1c1b22;--card:#2a2933;--ink:#f4f1ea;--mute:#b3afc2;--pri:#5fd391;--acc:#ffa664;--line:#3d3b4a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 14px}
.tabs,.pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;min-height:44px}
button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.st{text-align:center;padding:12px 6px;border-radius:16px;border:2px dashed var(--line);opacity:.45;transition:.2s}
.st.show{opacity:1;border-style:solid;border-color:var(--pri)}
.st.cur{transform:scale(1.05);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.em{font-size:2.8rem;display:block}
.nm{font-weight:700}
.desc{font-size:1.05rem;min-height:3.2em}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
.big{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.msg{font-weight:700;min-height:1.6em;margin-top:8px;text-align:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{text-align:left}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:70px;margin:10px 0}
.slot{width:78px;height:70px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.slot.f{border-style:solid;border-color:var(--ok)}
.cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cards button{font-size:1rem;padding:8px 12px}
.cards button:disabled{opacity:.3}
.score{font-size:1.3rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>🌱 Petualangan Siklus Hidup Hewan</h1>
<p class="sub">IPAS Kelas 3 · Ayo kenali bagaimana hewan tumbuh!</p>

<div class="tabs" role="tablist">
<button class="on" data-m="belajar">📖 Belajar</button>
<button data-m="urut">🧩 Urutkan</button>
<button data-m="kuis">⭐ Kuis</button>
</div>

<div class="pick" id="pick"></div>
<section id="view" class="box" aria-live="polite"></section>
</main>

<script>
var D={
kupu:{n:"🦋 Kupu-kupu",note:"Kupu-kupu mengalami perubahan bentuk yang sangat berbeda di setiap tahap.",s:[
{e:"🥚",n:"Telur",d:"Kupu-kupu betina menaruh telur kecil di daun."},
{e:"🐛",n:"Ulat",d:"Telur menetas jadi ulat. Ulat rakus makan daun supaya tumbuh besar."},
{e:"🧶",n:"Kepompong",d:"Ulat berhenti makan dan berubah di dalam kepompong."},
{e:"🦋",n:"Kupu-kupu",d:"Kepompong pecah. Keluarlah kupu-kupu bersayap indah!"}]},
katak:{n:"🐸 Katak",note:"Anak katak hidup di air dan bernapas dengan insang, lalu berubah jadi hewan darat.",s:[
{e:"🥚",n:"Telur",d:"Katak bertelur di air. Telurnya berlendir dan menggerombol."},
{e:"🐟",n:"Berudu",d:"Telur menetas jadi berudu. Berudu berenang dengan ekor dan bernapas dengan insang."},
{e:"🦎",n:"Berudu berkaki",d:"Kaki mulai tumbuh. Ekornya perlahan memendek."},
{e:"🐸",n:"Katak dewasa",d:"Katak dewasa bernapas dengan paru-paru dan bisa melompat jauh."}]},
ayam:{n:"🐔 Ayam",note:"Anak ayam sudah mirip induknya, hanya ukurannya lebih kecil.",s:[
{e:"🥚",n:"Telur",d:"Induk ayam mengerami telur selama sekitar tiga minggu."},
{e:"🐣",n:"Anak ayam",d:"Telur menetas. Anak ayam berbulu halus dan ikut induknya."},
{e:"🐥",n:"Ayam muda",d:"Bulu halus berganti bulu yang lebih kuat. Ayam muda mulai mencari makan sendiri."},
{e:"🐔",n:"Ayam dewasa",d:"Ayam dewasa bisa bertelur lagi, dan siklus pun berulang."}]}
};
var Q=[
{q:"Setelah telur menetas, kupu-kupu menjadi apa?",o:["Kepompong","Ulat","Berudu"],a:1,w:"Telur kupu-kupu menetas jadi ulat."},
{q:"Anak katak yang hidup di air disebut apa?",o:["Berudu","Ulat","Kepompong"],a:0,w:"Anak katak bernama berudu."},
{q:"Kepompong adalah tahap hidup dari hewan apa?",o:["Katak","Ayam","Kupu-kupu"],a:2,w:"Kepompong ada pada siklus hidup kupu-kupu."},
{q:"Hewan mana yang bentuk anaknya sudah mirip induknya?",o:["Ayam","Kupu-kupu","Katak"],a:0,w:"Anak ayam mirip induknya, tetapi lebih kecil."},
{q:"Berudu bernapas dengan apa?",o:["Paru-paru","Insang","Sayap"],a:1,w:"Berudu bernapas dengan insang."}];
var mode="belajar",an="kupu",step=0,view=document.getElementById("view");

function pick(){var p=document.getElementById("pick");
if(mode==="kuis"){p.innerHTML="";return}
p.innerHTML=Object.keys(D).map(function(k){return '<button data-a="'+k+'" class="'+(k===an?"on":"")+'">'+D[k].n+'</button>'}).join("")}

function belajar(){var h=D[an],s=h.s;
var g=s.map(function(x,i){return '<div class="st '+(i<=step?"show":"")+(i===step?" cur":"")+'"><span class="em">'+(i<=step?x.e:"❓")+'</span><span class="nm">'+(i<=step?x.n:"???")+'</span></div>'}).join("");
view.innerHTML='<div class="stages">'+g+'</div><p class="desc"><b>Tahap '+(step+1)+': '+s[step].n+'.</b> '+s[step].d+'</p>'+
'<p style="color:var(--mute)">'+h.note+'</p>'+
'<div class="row"><button id="pv" '+(step===0?"disabled":"")+'>⬅️ Kembali</button><button id="nx" class="big" '+(step===s.length-1?"disabled":"")+'>Berikutnya ➡️</button></div>'+
(step===s.length-1?'<p class="msg ok">🎉 Hebat! Siklus selesai. Coba hewan lain atau main Urutkan!</p>':"");
document.getElementById("pv").onclick=function(){step--;belajar()};
document.getElementById("nx").onclick=function(){step++;belajar()}}

var order,got;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function urut(){var s=D[an].s;order=shuffle(s.map(function(_,i){return i}));
if(order.join()===s.map(function(_,i){return i}).join())order.reverse();
got=[];drawU("Ketuk kartu sesuai urutan, mulai dari telur!","")}
function drawU(m,c){var s=D[an].s;
var sl=s.map(function(_,i){return '<div class="slot '+(i<got.length?"f":"")+'">'+(i<got.length?s[got[i]].e:i+1)+'</div>'}).join("");
var cd=order.map(function(i){return '<button data-i="'+i+'" '+(got.indexOf(i)>-1?"disabled":"")+'>'+s[i].e+' '+s[i].n+'</button>'}).join("");
view.innerHTML='<div class="slots">'+sl+'</div><div class="cards">'+cd+'</div><p class="msg '+c+'">'+m+'</p>'+
(got.length===s.length?'<div class="row" style="justify-content:center"><button class="big" id="again">🔁 Main lagi</button></div>':"");
var a=document.getElementById("again");if(a)a.onclick=urut}

var qi,sc,ans;
function kuis(){qi=0;sc=0;ans=false;drawQ()}
function drawQ(){
if(qi>=Q.length){var st=sc===Q.length?"🏆 Sempurna!":sc>=3?"👏 Bagus sekali!":"💪 Ayo belajar lagi, kamu pasti bisa!";
view.innerHTML='<p class="score">Skor kamu: <b>'+sc+' / '+Q.length+'</b></p><p class="msg">'+st+'</p><div class="row" style="justify-content:center"><button class="big" id="re">🔁 Ulangi kuis</button></div>';
document.getElementById("re").onclick=kuis;return}
var q=Q[qi];ans=false;
view.innerHTML='<p style="color:var(--mute)">Soal '+(qi+1)+' dari '+Q.length+'</p><h2 style="margin:4px 0">'+q.q+'</h2><div class="opts">'+
q.o.map(function(t,i){return '<button data-o="'+i+'">'+t+'</button>'}).join("")+'</div><p class="msg" id="fb"></p><div class="row" style="justify-content:center"><button class="big" id="nq" hidden>Lanjut ➡️</button></div>';
document.getElementById("nq").onclick=function(){qi++;drawQ()}}

function render(){pick();if(mode==="belajar")belajar();else if(mode==="urut")urut();else kuis()}

document.querySelector(".tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;
document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b)});
mode=b.dataset.m;step=0;render()};
document.getElementById("pick").onclick=function(e){var b=e.target.closest("button");if(!b)return;an=b.dataset.a;step=0;render()};
view.onclick=function(e){var b=e.target.closest("button");if(!b)return;
if(mode==="urut"&&b.dataset.i!==undefined){var i=+b.dataset.i;
if(i===got.length){got.push(i);
drawU(got.length===D[an].s.length?"🎉 Benar semua! Siklus hidupnya sudah lengkap!":"Benar! Lanjut tahap berikutnya.","ok")}
else drawU("Belum tepat, coba lagi ya!","bad")}
if(mode==="kuis"&&b.dataset.o!==undefined&&!ans){ans=true;var q=Q[qi],o=+b.dataset.o,fb=document.getElementById("fb");
var bs=view.querySelectorAll(".opts button");bs[q.a].classList.add("right");
if(o===q.a){sc++;fb.className="msg ok";fb.textContent="✅ Benar!"}
else{b.classList.add("wrong");fb.className="msg bad";fb.textContent="❌ "+q.w}
document.getElementById("nq").hidden=false}};
render();
</script>
</body>
</html>
